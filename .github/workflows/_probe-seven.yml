name: "[probe] 7-eleven access diagnostic"

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Show runner public IP
        run: curl -s https://api.ipify.org || true
      - name: Probe 7-eleven
        run: node scripts/_probe-seven.mjs

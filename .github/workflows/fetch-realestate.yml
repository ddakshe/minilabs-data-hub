name: Fetch Realestate

# 국토부 실거래가 → 부동산 미니앱 2종(앱 A 매매 / 앱 B 전월세).
#
# 주 2회만 도는 이유가 두 개다.
#
#  1. 실거래 신고 기한이 계약일 +30일이다. 오늘 체결된 계약은 최대 한 달 뒤에
#     데이터에 나타난다. 매일 받아도 어제와의 차이는 "한 달 전 계약 몇 건 추가"뿐이라
#     하루 단위 신선도가 의미를 만들지 못한다.
#  2. 인증키는 계정 공통이지만 **일일 요청제한은 서비스(활용신청) 단위로 센다.**
#     2026-08-24 실측: AptRent 가 returnReasonCode 22(일일 한도 초과)를 뱉는 순간
#     AptTrade·RHRent·OffiRent 는 같은 키로 정상 응답했다.
#     즉 다른 프로젝트(fetch-local-currency 등)와 겹쳐도 서로의 한도를 갉아먹지 않는다.
#     하지만 **이 워크플로 안의 AptTrade·AptRent 각각**은 하루 예산이 따로 있고,
#     정기 실행(3개월 = 종별 768회)과 백필(12개월 = 종별 3,072회)이 같은 날 겹치면
#     그 종목의 한도를 넘긴다. 겹치지 말아야 하는 건 남의 앱이 아니라 같은 종목이다.
#
# 3개월 롤링인 이유: 신고 지연 때문에 지난달·전전달 숫자가 계속 늘어난다.
# 한 번 받고 끝내면 과거가 영원히 과소집계로 남는다.
#
# 백필은 정기 실행에 맡기지 말 것 — workflow_dispatch 의 months 로 수동 실행한다.
# 한 종목만 막혔을 때는 service 로 그 종목만 다시 받는다(이미 받은 종목의 호출을 아낀다).

on:
  schedule:
    - cron: '0 21 * * 0,3'  # 월·목 06:00 KST (fetch-rates 06:00·fetch-recall 06:30 과 요일 분산)
  workflow_dispatch:
    inputs:
      months:
        description: '수집할 개월 수 (기본 3, 백필은 12)'
        required: false
        default: '3'
      service:
        description: '받을 종목 (한 종목만 막혔을 때 그것만 다시 받는다)'
        required: false
        type: choice
        default: 'all'
        options:
          - all
          - trade
          - rent
      reason:
        description: '실행 이유 (로그에만 기록, 선택)'
        required: false
        default: 'manual refresh'

permissions:
  contents: write

concurrency:
  group: fetch-realestate
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    # 동시성 3 고정이라 256지역 × 3개월 × 2종이면 20~40분 걸린다. 기본 6시간 한도로는 부족하지 않다.
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Show trigger context
        run: |
          echo "Event  : ${{ github.event_name }}"
          echo "Months : ${{ github.event.inputs.months || '3 (scheduled)' }}"
          echo "Service: ${{ github.event.inputs.service || 'all (scheduled)' }}"
          echo "Reason : ${{ github.event.inputs.reason || '(scheduled)' }}"
          TZ=Asia/Seoul date "+KST: %Y-%m-%d %H:%M:%S"

      # 의존성 없이 Node 내장 fetch 만 쓰므로 npm ci 를 생략한다.
      - name: Fetch realestate
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          MONTHS: ${{ github.event.inputs.months || '3' }}
          SERVICE: ${{ github.event.inputs.service || 'all' }}
        run: |
          ARGS="--months=$MONTHS"
          # all 은 스크립트 기본값(전 종목)이라 플래그를 붙이지 않는다.
          # `[ ] && ...` 로 쓰면 all 일 때 테스트가 1을 반환해 `bash -e` 가 스텝을 죽인다.
          if [ "$SERVICE" != "all" ]; then
            ARGS="$ARGS --service=$SERVICE"
          fi
          echo "→ node scripts/fetch-realestate.mjs $ARGS"
          node scripts/fetch-realestate.mjs $ARGS

      - name: Check for changes
        id: diff
        run: |
          git add realestate/
          # meta.json 은 fetchedAt 때문에 매번 바뀐다. 그것만 바뀌었으면 커밋하지 않는다 —
          # 내용이 같은데 커밋이 쌓이면 히스토리에서 진짜 변경을 못 찾는다.
          if git diff --cached --quiet -- realestate/trade realestate/rent; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "축약본 변화 없음 — 커밋 생략."
            git restore --staged realestate/ || true
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git --no-pager diff --cached --stat realestate/
          fi

      - name: Commit & push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          DATE_KST=$(TZ=Asia/Seoul date "+%Y-%m-%d")
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MSG="chore(realestate): manual refresh ($DATE_KST)"
          else
            MSG="chore(realestate): refresh ($DATE_KST)"
          fi

          git commit -m "$MSG"
          # 다른 워크플로가 같은 시간대에 밀어넣을 수 있다. 한 번은 되받아 재시도한다.
          git push || (git pull --rebase origin main && git push)

      - name: Summary
        if: always()
        run: |
          {
            echo "## Realestate Fetch Summary"
            echo ""
            echo "- Trigger: \`${{ github.event_name }}\`"
            echo "- Changed: \`${{ steps.diff.outputs.changed || 'n/a' }}\`"
            echo "- KST: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M:%S')"
            if [ -f realestate/meta.json ]; then
              echo ""
              echo '```json'
              cat realestate/meta.json
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

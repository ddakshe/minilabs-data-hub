name: Fetch auto-option

on:
  schedule:
    # 매월 1일 09:00 KST — 제조사가 가격표를 월초에 갱신한다. 주 단위로 돌릴 이유가 없다.
    - cron: '0 0 1 * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: fetch-auto-option
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Show trigger context
        run: |
          echo "Event : ${{ github.event_name }}"
          TZ=Asia/Seoul date "+KST: %Y-%m-%d %H:%M:%S"

      # 1단계 — 주소만 조회한다(HEAD). 여기서 바뀐 차종을 가려낸다.
      # 제조사가 연식마다 파일명을 바꾸므로 주소를 코드에 박아두면 안 된다.
      # 한때 고정 주소를 쓰다가 현대 13종이 2~4년 된 가격표로 등록된 적이 있다.
      - name: Resolve sources
        id: sources
        run: |
          CHANGED=$(node scripts/auto-option/resolve-sources.mjs auto-option/sources.json)
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
          if [ -z "$CHANGED" ]; then
            echo "원본이 하나도 안 바뀌었다 — 받지 않는다."
          else
            echo "바뀐 차종: $CHANGED"
          fi

      # 파싱할 게 있을 때만 깐다. 아무것도 안 바뀐 달에는 7초를 버릴 이유가 없다 —
      # 주소 조회 전체가 4초인데 설치가 더 오래 걸린다.
      - name: Install poppler
        if: steps.sources.outputs.changed != ''
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      # 2단계 — 바뀐 차종만 받아서 파싱한다. 나머지는 이전 결과를 그대로 옮긴다.
      # PDF 30개는 75MB 다. 한 차종만 바뀌었는데 전부 받을 이유가 없다.
      - name: Bake changed models
        if: steps.sources.outputs.changed != ''
        run: |
          node scripts/auto-option/bake.mjs /tmp/models.new.json --only "${{ steps.sources.outputs.changed }}"

      # 파서는 레이아웃이 바뀌면 에러 없이 쓰레기를 뽑는다. 이전 결과와 비교해
      # 말이 안 되는 변화면 커밋하지 않는다.
      - name: Guard
        id: guard
        if: steps.sources.outputs.changed != ''
        continue-on-error: true
        run: |
          {
            echo 'report<<GUARD_EOF'
            node scripts/auto-option/guard.mjs auto-option/models.json /tmp/models.new.json
            echo 'GUARD_EOF'
          } >> "$GITHUB_OUTPUT"

      # 여기서 멈추는 게 이 워크플로의 핵심이다. 틀린 값이 나가는 것보다
      # 하루 늦게 갱신되는 편이 낫다 — 옛 데이터는 최소한 한때 사실이었다.
      - name: Open issue when suspicious
        if: steps.guard.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT: ${{ steps.guard.outputs.report }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          DATE_KST=$(TZ=Asia/Seoul date "+%Y-%m-%d")
          {
            echo "자동 수집이 이전 데이터와 크게 다른 결과를 냈습니다. **커밋하지 않았습니다.**"
            echo ""
            echo "가격표 서식이 바뀌어 파서가 조용히 잘못 읽고 있을 가능성이 큽니다."
            echo ""
            echo '```'
            echo "$REPORT"
            echo '```'
            echo ""
            echo "### 확인할 것"
            echo "1. 원본 PDF 를 받아 레이아웃이 바뀌었는지 본다"
            echo "2. \`scripts/auto-option/parse-*.mjs\` 를 고친다"
            echo "3. 차종 하나만의 문제라면 파서가 아니라 \`models.config.mjs\` 에 예외로 둔다"
            echo "4. \`node scripts/auto-option/bake.mjs /tmp/x.json\` 으로 확인 후 수동 커밋"
            echo ""
            echo "실행 로그: $RUN_URL"
          } > /tmp/issue.md
          gh issue create --title "auto-option: 수상한 데이터 변화 ($DATE_KST)" --body-file /tmp/issue.md
          exit 1

      - name: Promote & update meta
        if: steps.guard.outcome == 'success'
        run: |
          cp /tmp/models.new.json auto-option/models.json
          node -e '
            const fs = require("node:fs");
            const p = "auto-option/meta.json";
            const models = JSON.parse(fs.readFileSync("auto-option/models.json", "utf8"));
            // skipped/known 은 사람이 관리한다 — 왜 빠졌는지가 자동 갱신에 지워지면 안 된다.
            const prev = fs.existsSync(p) ? JSON.parse(fs.readFileSync(p, "utf8")) : {};
            const brands = [...new Set(models.map((m) => m.brand))].sort();
            fs.writeFileSync(p, JSON.stringify({
              ...prev,
              fetchedAt: new Date().toISOString(),
              source: "기아·현대 공식 가격표 PDF",
              models: models.length,
              byBrand: Object.fromEntries(brands.map((b) => [b, models.filter((m) => m.brand === b).length])),
              trims: models.reduce((n, m) => n + m.trims.length, 0),
              options: models.reduce((n, m) => n + m.options.length, 0),
            }, null, 2) + "\n");
          '

      - name: Check for changes
        id: diff
        # 원본이 안 바뀌었어도 sources.json 은 갱신될 수 있다(조회 시각 등). 같이 본다.
        if: steps.guard.outcome == 'success' || steps.sources.outputs.changed == ''
        run: |
          git add auto-option/
          if git diff --cached --quiet -- auto-option/models.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes — skipping commit."
            git reset
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git --no-pager diff --cached --stat auto-option/
          fi

      - name: Commit & push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          DATE_KST=$(TZ=Asia/Seoul date "+%Y-%m-%d")
          git commit -m "chore(auto-option): monthly refresh ($DATE_KST)"
          # 다른 워크플로가 같은 시간대에 밀어넣을 수 있다. 한 번은 되받아 재시도한다.
          git push || (git pull --rebase origin main && git push)

      - name: Summary
        if: always()
        run: |
          {
            echo "## 가격표 수집 결과"
            echo ""
            echo "- Trigger: \`${{ github.event_name }}\`"
            echo "- Changed sources: \`${{ steps.sources.outputs.changed || '(none)' }}\`"
            echo "- Guard  : \`${{ steps.guard.outcome }}\`"
            echo "- Changed: \`${{ steps.diff.outputs.changed || 'n/a' }}\`"
            echo "- KST: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M:%S')"
            echo ""
            echo '```'
            echo "${{ steps.guard.outputs.report }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

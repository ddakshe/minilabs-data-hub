name: Fetch Benefit Gauge

on:
  schedule:
    # 매주 월요일 07:00 KST. 신규 제도 등록이 주 3~7건이라(2026-08 실측) 매일 돌려도
    # 대부분 diff 가 없다. 연초 1~2월은 제도 개정이 몰리므로 수동 실행을 한 번씩 걸 것.
    - cron: '0 22 * * 0'
  workflow_dispatch:
    inputs:
      reason:
        description: '실행 이유 (로그에만 기록, 선택)'
        required: false
        default: 'manual refresh'

permissions:
  contents: write

concurrency:
  group: fetch-benefit-gauge
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Show trigger context
        run: |
          echo "Event       : ${{ github.event_name }}"
          echo "Reason      : ${{ github.event.inputs.reason || '(scheduled)' }}"
          date -u "+UTC: %Y-%m-%d %H:%M:%S"
          TZ=Asia/Seoul date "+KST: %Y-%m-%d %H:%M:%S"

      # 스크립트 자체가 구조 검증(행 길이·비트 폭·정렬·시군구 인덱스)을 하고
      # 어긋나면 exit 1 로 죽는다. 그러면 아래 커밋 단계로 넘어가지 않는다.
      # 이 도메인은 값이 틀려도 화면이 정상으로 보이면서 개수만 조용히 틀려지므로
      # 커밋 전에 막는 것이 특히 중요하다.
      - name: Fetch benefits
        env:
          GOV24_KEY: ${{ secrets.GOV24_KEY }}
        run: node scripts/fetch-benefit-gauge.mjs

      - name: Check for changes
        id: diff
        run: |
          git add benefit-gauge/
          # meta.json 의 fetchedAt 은 매번 바뀌므로 그것만 달라진 경우는 커밋하지 않는다.
          if git diff --cached --quiet -- benefit-gauge/benefits.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "benefits.json 변경 없음 — 커밋을 건너뜁니다."
            git reset -- benefit-gauge/ >/dev/null
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git --no-pager diff --cached --stat benefit-gauge/
          fi

      - name: Commit & push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          DATE_KST=$(TZ=Asia/Seoul date "+%Y-%m-%d")
          TRIGGER="${{ github.event_name }}"
          if [ "$TRIGGER" = "workflow_dispatch" ]; then
            MSG="chore(benefit-gauge): manual refresh ($DATE_KST)"
          else
            MSG="chore(benefit-gauge): refresh ($DATE_KST)"
          fi

          git add benefit-gauge/
          git commit -m "$MSG"
          git push

      - name: Summary
        if: always()
        run: |
          {
            echo "## Benefit Gauge Fetch Summary"
            echo ""
            echo "- Trigger: \`${{ github.event_name }}\`"
            echo "- Changed: \`${{ steps.diff.outputs.changed || 'n/a' }}\`"
            echo "- KST: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M:%S')"
            if [ -f benefit-gauge/meta.json ]; then
              echo ""
              echo '```json'
              cat benefit-gauge/meta.json
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

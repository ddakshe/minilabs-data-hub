name: Probe Recall API

# recall-mini(리콜모아) 수집기를 만들기 전에 **접속만** 확인하는 일회성 진단.
#
# 이 API 키들은 신청 당시 등록한 IP(집 공인 IP) 기준으로 발급됐는데, Actions 러너는
# IP 가 고정되지 않는다. 수집기를 다 만든 뒤에 실패하면 원인 찾기가 번거로우니
# 카테고리당 1건씩만 찔러보고 러너 IP 와 함께 결과를 남긴다.
#
# 데이터를 쓰지도, 커밋하지도 않는다. schedule 없이 수동 실행만 한다.
# 접속이 확인되면 이 워크플로는 지우고 fetch-recall.yml 로 대체한다.

on:
  workflow_dispatch:
    inputs:
      reason:
        description: '실행 이유 (로그에만 기록, 선택)'
        required: false
        default: 'IP 제약 확인'

# 읽기만 한다. 커밋하지 않으므로 contents: write 가 필요 없다.
permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Show trigger context
        run: |
          echo "Event  : ${{ github.event_name }}"
          echo "Reason : ${{ github.event.inputs.reason || '(manual)' }}"
          TZ=Asia/Seoul date "+KST: %Y-%m-%d %H:%M:%S"

      # 의존성 없이 Node 내장 fetch 만 쓰므로 npm ci 를 생략한다 (다른 워크플로와 동일).
      - name: Probe
        env:
          RECALL_API_KEYS: ${{ secrets.RECALL_API_KEYS }}
        run: node scripts/probe-recall.mjs

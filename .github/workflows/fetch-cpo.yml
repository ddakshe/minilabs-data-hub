name: Fetch CPO (8개 브랜드 · 중단됨)

# ⏸ 2026-08-20: 자동 실행을 멈췄다.
#
# 앱인토스가 "인증중고차 정보 제공 서비스"의 출시를 한시적으로 제한했다
# (수수료 모델 검토 중, 단계적 오픈 예정, 재개 알림은 받을 수 없음).
# 소비 앱이 출시되지 못하는 동안 매일 1.3MB JSON diff 를 커밋할 이유가 없다.
# 되살리는 비용은 12초(전량 수집)라서 미리 신선하게 유지할 값도 없다.
#
# 재개하려면 아래 schedule 두 줄의 주석을 풀면 된다. 그때까지는
# Actions 탭에서 "Run workflow" 로 언제든 수동 실행할 수 있다.
on:
  # schedule:
  #   - cron: '20 0 * * *'   # 매일 09:20 KST
  workflow_dispatch:
    inputs:
      only:
        description: 'fetch 기반 브랜드 콤마목록 (비우면 전체). 예: benz,lexus'
        required: false
        default: ''
      max_per_brand:
        description: '브랜드당 최대 수집 건수(최신순). 비우면 무제한(기본). BMW는 별도 상한 700'
        required: false
        default: ''
      pw_only:
        description: 'Playwright 브랜드 콤마목록. 기본은 volvo (bmw·porsche는 CI 불가 — README 참고). skip 이면 건너뜀'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: fetch-cpo
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: npm ci

      # 포르쉐·볼보는 브라우저가 필요하다.
      - name: Install Chromium
        if: ${{ github.event.inputs.pw_only != 'skip' }}
        run: npx playwright install --with-deps chromium

      - name: Show trigger context
        run: |
          echo "Event  : ${{ github.event_name }}"
          echo "Only   : ${{ github.event.inputs.only || '(all fetch adapters)' }}"
          echo "PwOnly : ${{ github.event.inputs.pw_only || '(all pw adapters)' }}"
          TZ=Asia/Seoul date "+KST: %Y-%m-%d %H:%M:%S"

      # 두 스크립트가 같은 listings.json을 갱신하므로 순서대로 돌린다.
      - name: Fetch (API 기반)
        env:
          MAX_PER_BRAND: ${{ github.event.inputs.max_per_brand }}
        run: node scripts/fetch-cpo.mjs "${{ github.event.inputs.only }}"

      # bmw·porsche는 제외한다. 둘 다 러너에서 데이터가 오지 않는다(원인은 다르다):
      #   bmw     — 실제 Chrome + headed가 필요. 헤드리스는 조용히 0건이 된다.
      #   porsche — Vercel 봇 챌린지가 Actions 데이터센터 IP를 통과시키지 않는다.
      #             (실측: 셀렉터 대기 25초 × 2 = 51초 타임아웃 후 0건)
      # 둘은 로컬(맥)에서 돌린다. 실패해도 기존 데이터는 유지되지만 불필요한 2분을 쓰지 않는다.
      - name: Fetch (Playwright)
        if: ${{ github.event.inputs.pw_only != 'skip' }}
        env:
          MAX_PER_BRAND: ${{ github.event.inputs.max_per_brand }}
        run: |
          PW="${{ github.event.inputs.pw_only }}"
          node scripts/fetch-cpo-pw.mjs "${PW:-volvo}"

      - name: Check for changes
        id: diff
        run: |
          git add cpo/
          if git diff --cached --quiet -- cpo/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes — skipping commit."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git --no-pager diff --cached --stat cpo/
          fi

      - name: Commit & push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          DATE_KST=$(TZ=Asia/Seoul date "+%Y-%m-%d")
          git commit -m "chore(cpo): daily refresh ($DATE_KST)"
          # 다른 워크플로가 같은 시간대에 밀어넣을 수 있다. 한 번은 되받아 재시도한다.
          git push || (git pull --rebase origin main && git push)

      - name: Summary
        if: always()
        run: |
          {
            echo "## 인증중고차 수집 결과"
            echo ""
            echo "- Trigger: \`${{ github.event_name }}\`"
            echo "- Changed: \`${{ steps.diff.outputs.changed || 'n/a' }}\`"
            echo "- KST: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M:%S')"
            echo ""
            if [ -f cpo/listings.json ]; then
              echo '```'
              node -e "const d=require('./cpo/listings.json');console.log('total',d.total);console.log(Object.entries(d.byBrand).sort((a,b)=>b[1]-a[1]).map(([k,v])=>k+' '+v).join(' · '));if(d.failed?.length)console.log('failed:',d.failed.join(', '))"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

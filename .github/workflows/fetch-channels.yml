name: Fetch Channels (유튜브 채널 — 경제·부동산·도시개발)

on:
  schedule:
    # ⚠️ cron 은 **UTC** 다. 20:10 UTC + 9h = 다음날 05:10 KST.
    #    🔑 유튜브 쿼터는 **태평양시 자정**에 리셋된다(= 16:00 또는 17:00 UTC).
    #       그 뒤에 돌아야 하루 예산을 온전히 쓴다. 20:10 UTC 는 리셋 3~4시간 뒤다.
    - cron: '10 20 * * *'     # 매일 05:10 KST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-channels
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest      # 🔑 유튜브 API 는 허용 IP 등록이 없다 → 호스티드로 충분.
                                #    맥(셀프호스티드)에 묶지 않는 이유: 맥이 꺼진 날
                                #    series 에 구멍이 나고 그 구멍은 소급해서 못 메운다
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # 의존성 설치 단계가 없다 — 표준 라이브러리만 쓴다

      # 🔑 **스냅샷을 가장 먼저** 돌린다. 가장 싸고(5,000채널 ~100 units) 가장 중요하다.
      #    뒤 단계가 쿼터를 먹어도 그날 series 는 남는다
      - name: 스냅샷 (series — 이게 자산이다)
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python3 scripts/channels/snapshot.py

      # 씨앗 꽂기. 핸들 없는 것은 search 라 비싸서 며칠에 걸쳐 끝난다
      - name: 씨앗 해석
        continue-on-error: true
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python3 scripts/channels/resolve.py

      - name: 발굴 (질의 커서를 조금씩 돈다)
        continue-on-error: true
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python3 scripts/channels/discover.py

      # 🚧 영상 단위 수집(uploads.py)은 **2주 검증 동안 끈다** (2026-10-20).
      #    판정 지표인 "조회수 일간 증가분" 은 채널 스냅샷에서 나오므로 영상 단위가
      #    필요 없다. 끈 예산 2,500 units 를 발굴로 돌려 채널을 10배 속도로 쌓는다
      #    (discover.py PER_RUN 6 → 50). 길이 구간(1분 미만·3분 이상) 분석이 필요해지면
      #    이 단계를 되살린다 — 스크립트는 그대로 둔다.
      # - name: 길이 구간 (최근 7일 영상)
      #   continue-on-error: true
      #   env:
      #     YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      #   run: python3 scripts/channels/uploads.py

      # 앱이 읽을 정적 JSON. registry 를 그대로 내보내지 않는다(230KB → 홈 3KB)
      - name: 앱 데이터 빌드
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python3 scripts/channels/build_app.py

      - name: 요약 (로그로 읽는다)
        continue-on-error: true
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python3 scripts/channels/analyze.py

      - name: 변경이 있으면 커밋
        run: |
          if git diff --quiet channels/; then
            echo "변경 없음"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add channels/
          git commit -m "chore(channels): $(date -u -d '+9 hours' +%Y-%m-%d) 스냅샷"
          git pull --rebase --autostash
          git push

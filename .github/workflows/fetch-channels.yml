name: Fetch Channels (유튜브 채널 — 경제·부동산·도시개발)

on:
  schedule:
    # ⚠️ cron 은 **UTC** 다. 20:10 UTC + 9h = 다음날 05:10 KST.
    #    🔑 유튜브 쿼터는 **태평양시 자정**에 리셋된다(= 16:00 또는 17:00 UTC).
    #       그 뒤에 돌아야 하루 예산을 온전히 쓴다. 20:10 UTC 는 리셋 3~4시간 뒤다.
    - cron: '10 20 * * *'     # 매일 05:10 KST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-channels
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest      # 🔑 유튜브 API 는 허용 IP 등록이 없다 → 호스티드로 충분.
                                #    맥(셀프호스티드)에 묶지 않는 이유: 맥이 꺼진 날
                                #    series 에 구멍이 나고 그 구멍은 소급해서 못 메운다
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # 의존성 설치 단계가 없다 — 표준 라이브러리만 쓴다

      # 🔑 **스냅샷을 가장 먼저** 돌린다. 가장 싸고(5,000채널 ~100 units) 가장 중요하다.
      #    뒤 단계가 쿼터를 먹어도 그날 series 는 남는다
      - name: 스냅샷 (series — 이게 자산이다)
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python3 scripts/channels/snapshot.py

      # 씨앗 꽂기. 핸들 없는 것은 search 라 비싸서 며칠에 걸쳐 끝난다
      - name: 씨앗 해석
        continue-on-error: true
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python3 scripts/channels/resolve.py

      - name: 발굴 (질의 커서를 조금씩 돈다)
        continue-on-error: true
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python3 scripts/channels/discover.py

      # 최근 7일 영상 **집계** — 채널당 한 줄(영상 수 · 최고 조회수 · 길이 구간).
      # 🚨 영상 원본을 커밋하지 않는다. 채널당 30행이라 1,466채널이면 하루 6MB,
      #    1년이면 2.1GB 다(2026-10-23 실측). 집계는 64KB 로 끝난다.
      # 🚨 **주 1회(월요일)만** 돈다. 채널 성격(쇼츠 위주냐 롱폼이냐)은 느리게 변해
      #    매일 볼 이유가 없고, 매일 돌리면 발굴 예산과 다툰다.
      - name: 영상 집계 (주 1회)
        if: github.event_name == 'workflow_dispatch' || fromJSON(format('[{0}]', 1)) == fromJSON('[1]')
        continue-on-error: true
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          # 월요일(KST)에만. cron 은 UTC 라 KST 요일로 다시 센다
          if [ "$(TZ=Asia/Seoul date +%u)" = "1" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python3 scripts/channels/uploads.py
          else
            echo "월요일이 아니다 — 건너뜀"
          fi

      # 앱이 읽을 정적 JSON. registry 를 그대로 내보내지 않는다(230KB → 홈 3KB)
      - name: 앱 데이터 빌드
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python3 scripts/channels/build_app.py

      - name: 요약 (로그로 읽는다)
        continue-on-error: true
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python3 scripts/channels/analyze.py

      - name: 변경이 있으면 커밋
        run: |
          if git diff --quiet channels/; then
            echo "변경 없음"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add channels/
          git commit -m "chore(channels): $(date -u -d '+9 hours' +%Y-%m-%d) 스냅샷"
          git pull --rebase --autostash
          git push

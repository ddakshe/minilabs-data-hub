name: Fetch convenience-store events

on:
  schedule:
    - cron: '0 0 * * 4'    # 매주 목요일 09:00 KST. CU·GS25만 담당.
                           # (세븐 포함 3사 전부는 로컬 launchd가 매주 월요일 10:00에 처리 →
                           #  Action을 목요일로 두어 CU·GS25를 주 2회(월·목)로 분산 갱신)
  workflow_dispatch:
    inputs:
      chain:
        description: '긁을 체인 콤마목록 (비우면 cu,gs25,emart24 — 세븐은 해외 IP 차단이라 로컬에서만)'
        required: false
        default: ''

permissions:
  contents: write
  issues: write   # 실패 시 알림 이슈 생성/갱신

concurrency:
  group: fetch-convenience-events
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 이 스크래퍼는 내장 fetch만 사용 — playwright/cheerio 불필요.
      # 의존성 설치 없이 바로 실행한다.

      - name: Show trigger context
        run: |
          echo "Event : ${{ github.event_name }}"
          echo "Chain : ${{ github.event.inputs.chain || '(all)' }}"
          date -u "+UTC: %Y-%m-%d %H:%M:%S"
          TZ=Asia/Seoul date "+KST: %Y-%m-%d %H:%M:%S"

      - name: Fetch convenience-store data
        id: fetch
        run: |
          # 기본은 cu,gs25,emart24 (세븐일레븐은 해외 IP 차단 → 로컬 launchd가 담당, 여기선 기존 데이터 유지)
          CHAIN="${{ github.event.inputs.chain }}"
          node scripts/fetch-convenience-events.mjs "${CHAIN:-cu,gs25,emart24}"

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- convenience-events/products.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes — skipping commit."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git --no-pager diff --stat convenience-events/products.json
          fi

      - name: Commit & push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          DATE_KST=$(TZ=Asia/Seoul date "+%Y-%m-%d")
          TRIGGER="${{ github.event_name }}"
          if [ "$TRIGGER" = "workflow_dispatch" ]; then
            MSG="chore(convenience-events): manual refresh ($DATE_KST)"
          else
            MSG="chore(convenience-events): weekly refresh ($DATE_KST)"
          fi

          git add convenience-events/products.json
          git commit -m "$MSG"

          # 스크랩에 수 분이 걸려 그 사이 다른 워크플로가 main에 push했을 수 있다.
          # concurrency 그룹은 이 워크플로끼리만 막아주므로 레포 단위 경합은 여기서 처리한다.
          # (2026-07-09·2026-08-13 실행이 이 경합으로 실패했다 — local-weekly-scrape.sh와 동일한 재시도)
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "✓ push 완료 (시도 $attempt)"
              exit 0
            fi
            echo "push 거부됨 (시도 $attempt) — rebase 후 재시도"
            git pull --rebase origin main || { echo "rebase 실패 — 중단"; exit 1; }
            sleep 5
          done
          echo "push 실패 — 3회 시도 모두 거부"
          exit 1

      # 두 가지를 모두 알린다.
      #   (1) 잡 실패 — 완결성 위반·급감·push 거부 등으로 갱신이 멈춘 경우
      #   (2) 잡은 성공했지만 일부 체인이 통째로 실패한 경우 (커밋은 됐고 그 체인만 직전 데이터)
      # 실패해도 아무도 모르면 fail-closed는 "조용한 정지"가 된다.
      # 같은 이슈에 코멘트를 쌓아 매주 새 이슈가 열리지 않게 한다.
      - name: 이슈 알림
        if: failure() || steps.fetch.outputs.failed_chains != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TRIGGER: ${{ github.event_name }}
          FAILED_CHAINS: ${{ steps.fetch.outputs.failed_chains }}
          JOB_STATUS: ${{ job.status }}
        run: |
          MARKER="편의점 데이터 갱신 실패"
          if [ "$JOB_STATUS" = "failure" ]; then
            HEADLINE="편의점 행사 데이터 **갱신이 중단**됐습니다."
            IMPACT="라이브 데이터(\`convenience-events/products.json\`)는 **직전 정상본이 그대로 유지**됩니다. 앱에는 영향이 없고, 갱신만 멈춘 상태입니다."
          else
            HEADLINE="갱신은 됐지만 **일부 체인 수집이 실패**했습니다: \`$FAILED_CHAINS\`"
            IMPACT="실패한 체인은 **직전 데이터가 유지**된 채로 커밋됐습니다. 나머지 체인은 정상 갱신됐고 앱에는 영향이 없습니다. 다음 주기에 자동 복구되며, 반복되면 해당 체인 파서를 확인하세요."
          fi
          BODY=$(cat <<BODY_END
          $HEADLINE

          - 실행 로그: $RUN_URL
          - 트리거: \`$TRIGGER\`
          - 잡 상태: \`$JOB_STATUS\`
          - 시각: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M:%S') KST

          $IMPACT

          로그에서 아래를 확인하세요.
          - \`✗ 완결성 위반\` — 상류 총계에 못 미침(페이징 조기 종료 가능성)
          - \`✗ 수집량 급감\` — 직전 대비 20% 이상 감소
          - \`::warning title=체인 수집 실패\` — 체인 통째 실패(네트워크·차단 등)
          - \`push 실패\` — 3회 rebase 재시도 후에도 거부됨
          BODY_END
          )
          EXISTING=$(gh issue list --state open --limit 100 --json number,title \
            --jq "[.[] | select(.title | contains(\"$MARKER\"))][0].number")
          if [ -n "$EXISTING" ] && [ "$EXISTING" != "null" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
            echo "기존 이슈 #$EXISTING 에 코멘트 추가"
          else
            gh issue create --title "🚨 $MARKER" --body "$BODY"
          fi

      - name: Summary
        run: |
          echo "### 편의점 행사 데이터 갱신" >> "$GITHUB_STEP_SUMMARY"
          CHANGED="${{ steps.diff.outputs.changed }}"
          if [ "$CHANGED" = "true" ]; then
            echo "✅ convenience-events/products.json 업데이트 완료" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ℹ️ 변경사항 없음 (이전 데이터 유지)" >> "$GITHUB_STEP_SUMMARY"
          fi

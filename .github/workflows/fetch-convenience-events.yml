name: Fetch convenience-store events

on:
  schedule:
    - cron: '0 0 * * 4'    # 매주 목요일 09:00 KST. CU·GS25만 담당.
                           # (세븐 포함 3사 전부는 로컬 launchd가 매주 월요일 10:00에 처리 →
                           #  Action을 목요일로 두어 CU·GS25를 주 2회(월·목)로 분산 갱신)
  workflow_dispatch:
    inputs:
      chain:
        description: '긁을 체인 콤마목록 (비우면 cu,gs25 — 세븐은 해외 IP 차단이라 로컬에서만)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: fetch-convenience-events
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 이 스크래퍼는 내장 fetch만 사용 — playwright/cheerio 불필요.
      # 의존성 설치 없이 바로 실행한다.

      - name: Show trigger context
        run: |
          echo "Event : ${{ github.event_name }}"
          echo "Chain : ${{ github.event.inputs.chain || '(all)' }}"
          date -u "+UTC: %Y-%m-%d %H:%M:%S"
          TZ=Asia/Seoul date "+KST: %Y-%m-%d %H:%M:%S"

      - name: Fetch convenience-store data
        run: |
          # 기본은 cu,gs25 (세븐일레븐은 해외 IP 차단 → 로컬 launchd가 담당, 여기선 기존 데이터 유지)
          CHAIN="${{ github.event.inputs.chain }}"
          node scripts/fetch-convenience-events.mjs "${CHAIN:-cu,gs25}"

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- convenience-events/products.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes — skipping commit."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git --no-pager diff --stat convenience-events/products.json
          fi

      - name: Commit & push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          DATE_KST=$(TZ=Asia/Seoul date "+%Y-%m-%d")
          TRIGGER="${{ github.event_name }}"
          if [ "$TRIGGER" = "workflow_dispatch" ]; then
            MSG="chore(convenience-events): manual refresh ($DATE_KST)"
          else
            MSG="chore(convenience-events): weekly refresh ($DATE_KST)"
          fi

          git add convenience-events/products.json
          git commit -m "$MSG"
          git push

      - name: Summary
        run: |
          echo "### 편의점 행사 데이터 갱신" >> "$GITHUB_STEP_SUMMARY"
          CHANGED="${{ steps.diff.outputs.changed }}"
          if [ "$CHANGED" = "true" ]; then
            echo "✅ convenience-events/products.json 업데이트 완료" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ℹ️ 변경사항 없음 (이전 데이터 유지)" >> "$GITHUB_STEP_SUMMARY"
          fi

name: Fetch FX

# fx-lens-mini(환율 고시) 앱이 쓰는 환율 스냅샷.
#
# 한국은행 ECOS 는 **영업일에만** 값이 올라온다. 주말·공휴일에는 새 데이터가 없어
# diff 가 비고 커밋도 나지 않는다 — 평일만 도는 cron 으로 좁혀 헛돌지 않게 한다.
#
# 실행 시각이 늦은 이유: 매매기준율은 당일 오전에 고시되지만 확정 반영이 조금 늦다.
# 20:00 KST 면 그날 값이 안정적으로 들어와 있다.

on:
  schedule:
    - cron: '0 11 * * 1-5'  # 평일 20:00 KST
  workflow_dispatch:
    inputs:
      reason:
        description: '실행 이유 (로그에만 기록, 선택)'
        required: false
        default: 'manual refresh'

permissions:
  contents: write

concurrency:
  group: fetch-fx
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Show trigger context
        run: |
          echo "Event  : ${{ github.event_name }}"
          echo "Reason : ${{ github.event.inputs.reason || '(scheduled)' }}"
          TZ=Asia/Seoul date "+KST: %Y-%m-%d %H:%M:%S"

      # 의존성 없이 Node 내장 fetch 만 쓰므로 npm ci 를 생략한다.
      - name: Fetch FX
        env:
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
        run: node scripts/fetch-fx.mjs

      - name: Check for changes
        id: diff
        run: |
          git add fx/
          if git diff --cached --quiet -- fx/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes — skipping commit."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git --no-pager diff --cached --stat fx/
          fi

      - name: Commit & push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          DATE_KST=$(TZ=Asia/Seoul date "+%Y-%m-%d")
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MSG="chore(fx): manual refresh ($DATE_KST)"
          else
            MSG="chore(fx): refresh ($DATE_KST)"
          fi

          git commit -m "$MSG"
          git push

      - name: Summary
        if: always()
        run: |
          {
            echo "## FX Fetch Summary"
            echo ""
            echo "- Trigger: \`${{ github.event_name }}\`"
            echo "- Changed: \`${{ steps.diff.outputs.changed || 'n/a' }}\`"
            echo "- KST: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M:%S')"
          } >> "$GITHUB_STEP_SUMMARY"

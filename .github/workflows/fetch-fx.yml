name: Fetch FX

# fx-lens-mini(환율 고시) 앱이 쓰는 환율 스냅샷.
#
# 한국은행 ECOS 는 **영업일에만** 값이 올라온다. 주말·공휴일에는 새 데이터가 없어
# diff 가 비고 커밋도 나지 않는다 — 평일만 도는 cron 으로 좁혀 헛돌지 않게 한다.
#
# 하루 두 번 도는 이유:
#   11:00 KST — 매매기준율은 당일 오전에 고시된다. 낮에 앱을 여는 사용자가 전 영업일
#               값을 보지 않으려면 오전에 한 번 받아야 한다. 환전은 대개 낮에 한다.
#   20:00 KST — 확정 반영이 조금 늦을 수 있어 그날 값을 다시 확인한다. 오전에 가고시
#               값이 들어왔더라도 같은 날 저녁에 덮인다.
#
# 오전 실행이 헛돌아도 손해가 없다 — 아래 diff 단계가 변화 없으면 커밋을 건너뛴다.
# 그래서 이 오전 실행은 **관찰 가능한 실험**이다: 한 주 지나도 오전 실행이 커밋을 한 번도
# 만들지 않으면 ECOS 반영이 늦다는 뜻이므로 '0 11 * * 1-5' 로 되돌릴 것.
#
# ⚠️ ECOS 는 3분당 300회 버스트 제한이 있다 (초과 시 ERROR-602 로 실행 전체가 실패).
# 한 번 실행이 series() 약 32개 호출이고 fetchAll 이 100행 단위로 페이지를 넘기므로
# 실제 요청은 그보다 몇 배다. 여유가 무한하지 않아 **하루 2회가 상한**이다.
#
# 09:00~09:30 KST 를 피한 이유: 이 허브의 다른 워크플로가 그 구간에 몰려 있고
# (outlets 09:00, cpo 09:20, now-showing 09:30) GitHub 스케줄러는 정시에 몰리면 밀린다.

on:
  schedule:
    - cron: '0 2,11 * * 1-5'  # 평일 11:00 / 20:00 KST
  workflow_dispatch:
    inputs:
      reason:
        description: '실행 이유 (로그에만 기록, 선택)'
        required: false
        default: 'manual refresh'

permissions:
  contents: write

concurrency:
  group: fetch-fx
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Show trigger context
        run: |
          echo "Event  : ${{ github.event_name }}"
          echo "Reason : ${{ github.event.inputs.reason || '(scheduled)' }}"
          TZ=Asia/Seoul date "+KST: %Y-%m-%d %H:%M:%S"

      # 의존성 없이 Node 내장 fetch 만 쓰므로 npm ci 를 생략한다.
      - name: Fetch FX
        env:
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
        run: node scripts/fetch-fx.mjs

      - name: Check for changes
        id: diff
        run: |
          git add fx/
          if git diff --cached --quiet -- fx/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes — skipping commit."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git --no-pager diff --cached --stat fx/
          fi

      - name: Commit & push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          DATE_KST=$(TZ=Asia/Seoul date "+%Y-%m-%d")
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MSG="chore(fx): manual refresh ($DATE_KST)"
          else
            MSG="chore(fx): refresh ($DATE_KST)"
          fi

          git commit -m "$MSG"
          git push

      - name: Summary
        if: always()
        run: |
          {
            echo "## FX Fetch Summary"
            echo ""
            echo "- Trigger: \`${{ github.event_name }}\`"
            echo "- Changed: \`${{ steps.diff.outputs.changed || 'n/a' }}\`"
            echo "- KST: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M:%S')"
          } >> "$GITHUB_STEP_SUMMARY"

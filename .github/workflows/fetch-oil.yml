name: Fetch Oil (국내 주유소 평균가)

# oil-price-mini(기름값 미리보기) 앱이 쓰는 국내 주유소 평균가 시계열.
#   → 앱 저장소: ~/ClaudeProjects/oil-tools
#
# 🚨 한도가 좁다. 오피넷 일반 API 는 2026-09-01 부터 1,500 → **300 call/일** 로 내려갔다.
#    이 워크플로는 실행당 **2 call** 이다(avgRecentPrice + avgAllPrice).
#    백테스트 수집(probe)을 같은 날 돌릴 거면 261 call 을 더 쓰므로 합계를 확인할 것.
#    **앱에서 런타임 호출은 절대 금지** — 사용자 100명이면 그날로 한도가 끝난다.
#
# 매일 도는 이유: avgRecentPrice 는 **최근 7일 창** 이다. 하루 거르면 그만큼만 구멍이
# 나고 6일 안에 복구하면 메워지지만, 7일을 넘기면 **영구 결번** 이다. 기록형 앱이라
# 시계열 구멍이 그대로 자산 손실이다.
#
# 07:40 KST 인 이유: 오늘자 잠정치는 자정 직후부터 나온다(01:06 KST 확인). 아침에
# 앱을 여는 사용자가 어제 값을 보지 않도록 출근 전에 한 번 받는다.
# 정각·30분은 이 허브의 다른 워크플로가 몰려 있어 :40 으로 비켰다.
#
# ⏱ 실측: 첫 예약 실행(2026-09-05)이 22:40 UTC 예약인데 **00:21 UTC 에 돌았다**
#    — 약 100분 지연. GitHub 스케줄러는 원래 이렇게 밀린다. 이 배치는 하루 한 번
#    기록만 남기면 되므로 지연이 문제가 아니지만, "07:40 에 갱신된다"고 앱 화면에
#    적지는 말 것. 기준일은 meta.json 의 값을 쓴다.

on:
  schedule:
    - cron: '40 22 * * *'   # 매일 07:40 KST
  workflow_dispatch:
    inputs:
      reason:
        description: '실행 이유 (로그에만 기록, 선택)'
        required: false
        default: 'manual refresh'

permissions:
  contents: write

concurrency:
  group: fetch-oil
  cancel-in-progress: false

jobs:
  fetch:
    # 오피넷은 국내 기관이다. ECOS·recall 처럼 GitHub 러너 IP 풀의 일부를 막을 가능성이
    # 있다(fetch-fx.yml 주석 참고). 우선 ubuntu 로 두고, 실패가 관측되면
    # [self-hosted, macOS, ARM64] 로 옮긴다 — 그때는 러너의
    # ~/.config/stock-tools/opinet.env 를 그대로 읽을 수 있다(스크립트가 지원한다).
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Show trigger context
        run: |
          echo "Event  : ${{ github.event_name }}"
          echo "Reason : ${{ github.event.inputs.reason || '(scheduled)' }}"
          TZ=Asia/Seoul date "+KST: %Y-%m-%d %H:%M:%S"

      # 의존성 없이 Node 내장 fetch 만 쓰므로 npm ci 를 생략한다.
      - name: Fetch oil prices
        env:
          OPINET_API_KEY: ${{ secrets.OPINET_API_KEY }}
        run: node scripts/fetch-oil.mjs

      # 오늘의 예측을 기록하고 지난 예측을 채점한다.
      # predictions 는 append-only — 이미 있는 날짜는 값이 달라져도 덮지 않는다.
      - name: Record prediction & score
        run: node scripts/oil-predict.mjs

      # 🚨 diff 판정은 **prices.json 으로만** 한다.
      #    meta.json 에는 fetchedAt 이 있어 매 실행 반드시 바뀐다. 이걸 판정에 넣으면
      #    값이 그대로인 날에도 커밋이 나서 이력이 지저분해진다.
      #
      #    ⚠️ 나중에 oil/predictions/ 가 붙으면 **그건 이 판정에서 빼고 무조건 커밋한다.**
      #    "그날 예측을 발표했다"를 증명하는 게 git 커밋 타임스탬프이기 때문이다.
      #    값이 안 변했다고 건너뛰면 기록에 구멍이 나고, 나중에 채우면 사후 조작과
      #    구별되지 않는다. (oil-tools/CLAUDE.md 의 append-only 규칙)
      - name: Check for changes
        id: diff
        run: |
          # 🚨 기록(predictions/actuals/scoreboard)은 **가격 변화와 무관하게 항상** 올린다.
          #    "그날 예측을 발표했다"를 증명하는 게 git 커밋 타임스탬프다. 값이 안
          #    변했다고 건너뛰면 기록에 구멍이 나고, 나중에 채우면 사후 조작과
          #    구별되지 않는다. 셋 다 결정적이라 내용이 같으면 diff 도 안 생긴다.
          #
          # 🚨 **화이트리스트로 나열하지 않는다.** 예전엔 여기에 파일명을 적었는데
          #    새 산출물이 생길 때마다 등록을 잊었다 — 실제로 `oil/app`(앱이 읽는
          #    today/score/detail/regions)과 `oil/regions.json`(시도별 이력)이 둘 다
          #    빠져 있었다. 스크립트는 성공하고 워크플로는 초록불인데 파일만 조용히
          #    버려진다. 실패 신호가 어디에도 없어서 3주를 못 알아챘다.
          #    (2026-09-06 발견: `oil/regions.json` 은 "매일 쌓는다"면서 하루도 안 쌓였고,
          #     `oil/app/today.json` 은 주 1회만 갱신돼 앱이 최대 6일 묵은 값을 보였다)
          #
          #    → 기본을 **"oil/ 전부 커밋"** 으로 두고, 예외만 아래에서 되돌린다.
          #      이러면 산출물이 늘어도 등록을 잊을 자리가 없다.
          git add oil

          # 예외는 시세뿐이다. meta.json 의 fetchedAt 은 매 실행 바뀌므로, 가격이
          # 그대로인 날엔 이것 때문에 빈 커밋이 나지 않게 둘 다 되돌린다.
          # 판정을 prices.json 하나로만 하는 이유는 위 주석과 같다.
          if git diff --cached --quiet -- oil/prices.json; then
            echo "No price change."
            git restore --staged oil/prices.json oil/meta.json 2>/dev/null || true
            git checkout -- oil/prices.json oil/meta.json 2>/dev/null || true
          fi

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Nothing to commit."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git --no-pager diff --cached --stat oil/
          fi

      - name: Commit & push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          DATE_KST=$(TZ=Asia/Seoul date "+%Y-%m-%d")
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MSG="chore(oil): manual refresh ($DATE_KST)"
          else
            MSG="chore(oil): refresh ($DATE_KST)"
          fi

          git commit -m "$MSG"
          # 다른 워크플로가 같은 시간대에 밀어넣을 수 있다. 한 번은 되받아 재시도한다.
          git push || (git pull --rebase origin main && git push)

      - name: Summary
        if: always()
        run: |
          {
            echo "## Oil Fetch Summary"
            echo ""
            echo "- Trigger: \`${{ github.event_name }}\`"
            echo "- Changed: \`${{ steps.diff.outputs.changed || 'n/a' }}\`"
            echo "- KST: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M:%S')"
          } >> "$GITHUB_STEP_SUMMARY"

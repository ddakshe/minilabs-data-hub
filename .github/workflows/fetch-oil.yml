name: Fetch Oil (국내 주유소 평균가)

# oil-price-mini(기름값 미리보기) 앱이 쓰는 국내 주유소 평균가 시계열.
#   → 앱 저장소: ~/ClaudeProjects/oil-tools
#
# 🚨 한도가 좁다. 오피넷 일반 API 는 2026-09-01 부터 1,500 → **300 call/일** 로 내려갔다.
#    이 워크플로는 실행당 **2 call** 이다(avgRecentPrice + avgAllPrice).
#    백테스트 수집(probe)을 같은 날 돌릴 거면 261 call 을 더 쓰므로 합계를 확인할 것.
#    **앱에서 런타임 호출은 절대 금지** — 사용자 100명이면 그날로 한도가 끝난다.
#
# 매일 도는 이유: avgRecentPrice 는 **최근 7일 창** 이다. 하루 거르면 그만큼만 구멍이
# 나고 6일 안에 복구하면 메워지지만, 7일을 넘기면 **영구 결번** 이다. 기록형 앱이라
# 시계열 구멍이 그대로 자산 손실이다.
#
# 07:40 KST 인 이유: 오늘자 잠정치는 자정 직후부터 나온다(01:06 KST 확인). 아침에
# 앱을 여는 사용자가 어제 값을 보지 않도록 출근 전에 한 번 받는다.
# 정각·30분은 이 허브의 다른 워크플로가 몰려 있어 :40 으로 비켰다.

on:
  schedule:
    - cron: '40 22 * * *'   # 매일 07:40 KST
  workflow_dispatch:
    inputs:
      reason:
        description: '실행 이유 (로그에만 기록, 선택)'
        required: false
        default: 'manual refresh'

permissions:
  contents: write

concurrency:
  group: fetch-oil
  cancel-in-progress: false

jobs:
  fetch:
    # 오피넷은 국내 기관이다. ECOS·recall 처럼 GitHub 러너 IP 풀의 일부를 막을 가능성이
    # 있다(fetch-fx.yml 주석 참고). 우선 ubuntu 로 두고, 실패가 관측되면
    # [self-hosted, macOS, ARM64] 로 옮긴다 — 그때는 러너의
    # ~/.config/stock-tools/opinet.env 를 그대로 읽을 수 있다(스크립트가 지원한다).
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Show trigger context
        run: |
          echo "Event  : ${{ github.event_name }}"
          echo "Reason : ${{ github.event.inputs.reason || '(scheduled)' }}"
          TZ=Asia/Seoul date "+KST: %Y-%m-%d %H:%M:%S"

      # 의존성 없이 Node 내장 fetch 만 쓰므로 npm ci 를 생략한다.
      - name: Fetch oil prices
        env:
          OPINET_API_KEY: ${{ secrets.OPINET_API_KEY }}
        run: node scripts/fetch-oil.mjs

      # 🚨 diff 판정은 **prices.json 으로만** 한다.
      #    meta.json 에는 fetchedAt 이 있어 매 실행 반드시 바뀐다. 이걸 판정에 넣으면
      #    값이 그대로인 날에도 커밋이 나서 이력이 지저분해진다.
      #
      #    ⚠️ 나중에 oil/predictions/ 가 붙으면 **그건 이 판정에서 빼고 무조건 커밋한다.**
      #    "그날 예측을 발표했다"를 증명하는 게 git 커밋 타임스탬프이기 때문이다.
      #    값이 안 변했다고 건너뛰면 기록에 구멍이 나고, 나중에 채우면 사후 조작과
      #    구별되지 않는다. (oil-tools/CLAUDE.md 의 append-only 규칙)
      - name: Check for changes
        id: diff
        run: |
          git add oil/prices.json
          if git diff --cached --quiet -- oil/prices.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No price change — skipping commit."
            git restore --worktree --staged oil/ 2>/dev/null || git checkout -- oil/
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git add oil/meta.json
            git --no-pager diff --cached --stat oil/
          fi

      - name: Commit & push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          DATE_KST=$(TZ=Asia/Seoul date "+%Y-%m-%d")
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MSG="chore(oil): manual refresh ($DATE_KST)"
          else
            MSG="chore(oil): refresh ($DATE_KST)"
          fi

          git commit -m "$MSG"
          # 다른 워크플로가 같은 시간대에 밀어넣을 수 있다. 한 번은 되받아 재시도한다.
          git push || (git pull --rebase origin main && git push)

      - name: Summary
        if: always()
        run: |
          {
            echo "## Oil Fetch Summary"
            echo ""
            echo "- Trigger: \`${{ github.event_name }}\`"
            echo "- Changed: \`${{ steps.diff.outputs.changed || 'n/a' }}\`"
            echo "- KST: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M:%S')"
          } >> "$GITHUB_STEP_SUMMARY"

name: Fetch Urban Plan (도시계획 지도 · 맥)

# 도시계획 지도(city-plan-map) 미니앱이 쓰는 urban-plan/ 을 굽는다.
#
#   1) 택지정보시스템(jigu.go.kr) 개발사업지구 — 무인증 · 세션 쿠키 필수 · 월 1회 갱신
#   2) 전국도시재생사업정보표준데이터 — data.go.kr 다운로드 AJAX(무인증) · 매월 초 병합
#   3) 전국도시개발사업정보표준데이터 — 같은 AJAX(무인증). 지자체가 각자 올려 기준일이 행마다 다르다
#   4) 한국도로공사 고속도로 공사현황 — EX_API_KEY(월 1콜, 휴게소 워크플로와 같은 secret).
#      주소 → 좌표는 urban-plan/cache/bjd-centroids.json(손으로 굽는다, scripts/build-bjd-centroids.py)
#   5) GTX seed 검증 — 네트워크 없음. seed 를 손으로 고쳤을 때 여기서 한 번 더 막힌다
#
# 인증키는 4) 하나뿐이다 → docs/api-limits.json 의 EX_API_KEY 에 신고했다.
#
# 매일 도는 이유 (2026-10-21 에 월 1회에서 바꿨다):
#   택지정보시스템 기준일은 전월 말일이고 실제 게시는 10일 전후라, 원래는 매월 10일 1회였다.
#   그런데 2026-10-08 에 그 사이트가 해킹 조사로 서비스를 전면 중지했고, 10-10 실행이
#   그걸로 실패하자 **다음 기회가 11-10** 이 되어 41일이 비었다.
#   복구 시점을 알 수 없는 출처에 월 1회는 위험하다. 매일 두드리되 데이터가 안 바뀌면
#   커밋하지 않으므로(Check for changes) 저장소는 조용하다.
#   07:30 KST 는 매일 22:00 UTC 배치 두 개와 aptcost(8일 07:00)를 피한 자리다.
#
# 셀프호스티드(한국 IP)로 돌린다. 이 허브는 국내 기관이 GitHub 러너 IP 일부를 막는 걸
# 여러 번 겪었다(fetch-aptcost.yml 주석 참고). jigu 는 해외 IP 에서 열린 기록도 있지만
# WAF 가 까다로운 사이트라 동전 던지기를 남기지 않는다.

on:
  schedule:
    - cron: '30 22 * * *'  # 매일 07:30 KST
  workflow_dispatch:
    inputs:
      reason:
        description: '실행 이유 (로그에만 기록, 선택)'
        required: false
        default: 'manual refresh'

permissions:
  contents: write
  issues: write   # 실패 시 알림 이슈 생성/갱신

concurrency:
  group: fetch-urban-plan
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Headers.getSetCookie() 가 필요하다 (Node 19.7+)
          node-version: '20'

      - name: Show trigger context
        run: |
          echo "Event  : ${{ github.event_name }}"
          echo "Reason : ${{ github.event.inputs.reason || '(scheduled)' }}"
          TZ=Asia/Seoul date "+KST: %Y-%m-%d %H:%M:%S"

      # 🚨 이 스텝이 죽으면 아래 네 스텝(도시재생·도시개발·고속도로·GTX)도 못 돈다 —
      #    출처가 다른데 같이 멈춘다. 2026-10-08 jigu 중지 이후 실제로 그랬다
      #    (도시재생이 179건 → 180건으로 바뀌어 있었는데 막혀 있었다).
      #    그래서 **출처 점검(exit 75)은 실패로 치지 않고** 건너뛴다.
      - name: 개발사업지구 (택지정보시스템)
        id: jigu
        run: |
          set +e
          node scripts/fetch-urban-plan.mjs
          code=$?
          set -e
          if [ "$code" -eq 75 ]; then
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            echo "::warning title=택지정보시스템 점검 중::개발사업지구만 건너뛰었습니다. 다른 출처는 계속 갱신됩니다."
            exit 0
          fi
          exit "$code"

      - name: 도시재생 사업지
        run: node scripts/fetch-urban-renewal.mjs

      - name: 도시개발사업
        run: node scripts/fetch-urban-develop.mjs

      - name: 고속도로 공사현황
        env:
          EX_API_KEY: ${{ secrets.EX_API_KEY }}
        run: node scripts/fetch-urban-highway.mjs

      - name: GTX seed 검증
        run: node scripts/build-urban-gtx.mjs

      - name: Check for changes
        id: diff
        run: |
          git add urban-plan/

          # meta.json 의 generatedAt 은 매 실행마다 바뀐다. 그것만 달라졌다면 커밋하지 않는다.
          FILES=$(git diff --cached --name-only -- urban-plan/)
          if [ "$FILES" = "urban-plan/meta.json" ]; then
            OTHER=$(git diff --cached -U0 -- urban-plan/meta.json \
                    | grep -E '^[+-]' | grep -vE '^(\+\+\+|---)' \
                    | grep -vc 'generatedAt' || true)
            if [ "${OTHER:-0}" -eq 0 ]; then
              git restore --staged --worktree urban-plan/meta.json
              echo "changed=false" >> "$GITHUB_OUTPUT"
              echo "generatedAt 만 변경 — 커밋 건너뜀."
              exit 0
            fi
          fi

          if git diff --cached --quiet -- urban-plan/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes — skipping commit."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git --no-pager diff --cached --stat urban-plan/ | tail -5
          fi

      - name: Commit & push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          DATE_KST=$(TZ=Asia/Seoul date "+%Y-%m-%d")
          git commit -m "chore(urban-plan): monthly refresh ($DATE_KST)"
          # 다른 워크플로가 같은 시간대에 밀어넣을 수 있다. 한 번은 되받아 재시도한다.
          git push || (git pull --rebase origin main && git push)

      # 실패해도 아무도 모르면 "조용한 정지"가 된다. 월 1회였던 시절엔 한 달 뒤에나 알았다.
      # 같은 이슈에 코멘트를 쌓아 장애가 며칠 가도 이슈가 하나만 열리게 한다.
      - name: 이슈 알림
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TRIGGER: ${{ github.event_name }}
        run: |
          MARKER="도시개발 레이더 데이터 갱신 실패"
          # heredoc 본문은 YAML 때문에 들여써야 하므로, 이슈에 넣기 전에 그 들여쓰기를 벗긴다.
          BODY=$(sed 's/^ \{10\}//' <<BODY_END
          도시개발 레이더 데이터 **갱신이 중단**됐습니다.
          
          - 실행 로그: $RUN_URL
          - 트리거: \`$TRIGGER\`
          - 시각: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M:%S') KST
          
          라이브 데이터(\`urban-plan/\`)는 **직전 정상본이 그대로 유지**됩니다.
          앱(\`com.kennen.cityplan\`)은 계속 동작하고 **갱신만 멈춘** 상태입니다.
          
          ### 먼저 볼 것
          
          **출처가 점검 중이면 이 이슈가 뜨지 않습니다** — 점검은 exit 75 로 조용히 건너뜁니다.
          이 이슈가 떴다는 건 **그 밖의 고장**이라는 뜻입니다.
          
          - \`고시월 옵션을 찾지 못했다 (함정 2)\` → 점검이 아닌데 옵션이 없다 = **페이지 구조가 진짜 바뀜**
          - \`HTTP 406\` → 세션·WAF (함정 1). 해외 IP 에서 자주 난다
          - \`validate 실패\` → 받아는 왔는데 건수·용량이 기준을 벗어남
          
          ### 출처 상태 보기
          
          \`\`\`bash
          curl -sS -A "Mozilla/5.0" https://www.jigu.go.kr/main.do | wc -c   # 3KB 대면 점검 페이지
          \`\`\`
          
          복구된 뒤 바로 받고 싶으면 손으로 돌린다 (매일 07:30 KST 에 자동 재시도한다).
          
          \`\`\`bash
          gh workflow run fetch-urban-plan.yml -f reason="복구 확인 재실행"
          \`\`\`
          BODY_END
          )
          EXISTING=$(gh issue list --state open --limit 100 --json number,title \
            --jq "[.[] | select(.title | contains(\"$MARKER\"))][0].number")
          if [ -n "$EXISTING" ] && [ "$EXISTING" != "null" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "🚨 $MARKER" --body "$BODY"
          fi

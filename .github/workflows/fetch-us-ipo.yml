name: fetch-us-ipo

on:
  schedule:
    - cron: '0 23 * * *'      # 08:00 KST
  workflow_dispatch:

# 데이터 커밋을 위해 쓰기 권한이 필요하다
permissions:
  contents: write

# 동시 실행을 막는다. 두 번이 겹치면 같은 파일에 push 가 충돌한다
concurrency:
  group: fetch-us-ipo
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # 의존성 설치 단계가 없다 — 표준 라이브러리만 쓴다.
      # SEC EDGAR 는 키도 허용 IP 등록도 요구하지 않으므로 Secrets 도 필요 없다.

      - name: 수집
        env:
          # 연락처일 뿐 비밀이 아니다. SEC 가 User-Agent 에 요구한다.
          SEC_USER_AGENT: stock-tools kyungtaekim@odkmedia.net
        run: python3 scripts/us-ipo/build_us_ipo.py

      - name: 변경이 있으면 커밋
        run: |
          if git diff --quiet us-ipo/ipo.json; then
            echo "변경 없음"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add us-ipo/ipo.json
          git commit -m "chore(us-ipo): 데이터 갱신 $(date -u +%Y-%m-%d)"
          # 다른 워크플로가 그 사이 push 했을 수 있다
          git pull --rebase --autostash origin main
          git push

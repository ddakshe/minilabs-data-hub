name: _diag data.go.kr 도달성

# 🩺 일회성 진단이다. 원인이 확인되면 삭제한다.
#    build-wanted 가 fetch-price 에서만 죽는데(run 33045244993) Firestore 호출은
#    성공한다 — 러너의 인터넷은 살아 있고 apis.data.go.kr 만 못 닿는 것으로 보인다.
#    DNS·TCP·TLS 어느 층에서 끊기는지 확인한다.
on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: 러너 위치
        continue-on-error: true
        run: curl -sS --max-time 10 https://ipinfo.io/json || true

      - name: DNS (A / AAAA)
        continue-on-error: true
        run: |
          echo "--- A ---";    dig +short A    apis.data.go.kr || true
          echo "--- AAAA ---"; dig +short AAAA apis.data.go.kr || true

      - name: TCP 443 (IPv4 강제)
        continue-on-error: true
        run: |
          for ip in $(dig +short A apis.data.go.kr | grep -E '^[0-9.]+$'); do
            echo "== $ip =="
            timeout 12 bash -c "cat < /dev/null > /dev/tcp/$ip/443" \
              && echo "  TCP 443 OPEN" || echo "  TCP 443 FAIL(rc=$?)"
          done

      - name: curl -4 (TLS + HTTP)
        continue-on-error: true
        run: |
          curl -4 -sS -o /dev/null --max-time 20 \
            -w 'ipv4 http=%{http_code} dns=%{time_namelookup}s conn=%{time_connect}s tls=%{time_appconnect}s total=%{time_total}s\n' \
            'https://apis.data.go.kr/1160100/service/GetStockSecuritiesInfoService/getStockPriceInfo' \
            || echo "curl -4 실패 rc=$?"

      - name: curl -6
        continue-on-error: true
        run: |
          curl -6 -sS -o /dev/null --max-time 20 \
            -w 'ipv6 http=%{http_code} total=%{time_total}s\n' \
            'https://apis.data.go.kr/1160100/service/GetStockSecuritiesInfoService/getStockPriceInfo' \
            || echo "curl -6 실패 rc=$?"

      # 대조군 — DART 와 Google 은 되는지. 되면 '한국 공공 API 전반'이 아니라
      # data.go.kr 한 곳의 문제로 좁혀진다.
      - name: 대조군 (opendart / google)
        continue-on-error: true
        run: |
          for u in https://opendart.fss.or.kr/api/list.json https://news.google.com/rss; do
            curl -4 -sS -o /dev/null --max-time 20 -w "$u -> http=%{http_code} total=%{time_total}s\n" "$u" \
              || echo "$u 실패 rc=$?"
          done

      - name: node fetch (러너에서 실제 코드 경로)
        continue-on-error: true
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: |
          node -e '
            const dns = require("node:dns");
            dns.setDefaultResultOrder("ipv4first");
            const t = Date.now();
            const key = process.env.DATA_GO_KR_KEY ?? "";
            const url = "https://apis.data.go.kr/1160100/service/GetStockSecuritiesInfoService/getStockPriceInfo"
              + `?serviceKey=${key}&resultType=json&numOfRows=1&likeSrtnCd=000370`;
            fetch(url, { signal: AbortSignal.timeout(30000) })
              .then(async (r) => console.log("node fetch ok", r.status, Date.now() - t + "ms",
                                             (await r.text()).slice(0, 200)))
              .catch((e) => console.log("node fetch FAIL", Date.now() - t + "ms", e.message,
                                        e.cause ? "| cause: " + e.cause.message : ""));
          '
